      - { nombre: tipo_radicacion, fuente: matriz, valor: Masiva }
      - { nombre: narrativa, fuente: generado, valor: "Ref. QA ${unico}." }
      # Narrativa del Ciclo 1 aportada por Daniel (QA), FICTICIA (HU06 V1.1 + aclaración de Daniel, 2026-10-16): la extracción del Worker AI no exige
      # pólizas existentes en SISE. Máx. 500 caracteres en total con la referencia de la corrida (regresión unitaria).
      - { nombre: narrativa_polizas, fuente: generado, valor: "Se solicita realizar la modificación de las pólizas 100245678, 1109876543, 9023456781 y 12012345678. El cambio corresponde a la actualización de información registrada en cada una de las pólizas, de acuerdo con las condiciones definidas para la solicitud. Se requiere validar que la modificación sea aplicada correctamente a todas las pólizas relacionadas, manteniendo sin cambios la información que no haga parte del ajuste solicitado." }
    usado_por: [HU06-CP03]
    limpieza: CLEANUP_NOT_APPLICABLE.

  INI-CUMPL-MASIVO-CON-RCE:
    descripcion: HU06-CP04. Cumplimiento, Ramo CON propiedad Póliza RCE.
    actor: intermediario
    propiedades:
      - { nombre: linea, fuente: matriz, valor: Cumplimiento }

# Manifest de los 17 CP SDE-CEL. Títulos, pasos y requisitos NO se copian aquí: viven en
# fuentes/matriz.json (extracción literal de los Excel). Este archivo agrega lo que la matriz no dice:
# familia, fase, actores, datos, escenario ejecutable y estado.
# Estados:  PREPARADO (modelado, sin escenario) | EJECUTABLE (escenario listo, prerrequisitos OK, sin correr)
#           BLOCKED (escenario listo, faltan credenciales/datos/ambiente) | FAIL | REAL_PASS_PARCIAL | REAL_PASS
# Regla: un CP solo puede pasar a REAL_PASS* con un reporte en test-results/seguros-del-estado/sde/ (evidencia).

familias:
  F-MASIVO-ESTRUCTURAR:
    descripcion: Inicio Masivo → compuerta ¿Masivo? → Worker AI → Estructurar Información (analista) → edición de Pólizas asociadas.
    variaciones: [Línea (Generales | Autos | Cumplimiento), Forma de Consulta por Línea/Movimiento, propiedad Póliza RCE del Ramo, texto de ayuda Masivo]
    capacidades: [iniciar_sesion, nuevo_caso, diligenciar, adjuntar, pulsar, verificar_ruta, abrir_caso, tabla_verificar, tabla_abrir_fila, tabla_agregar, dialogo_confirmar, tabla_eliminar_fila, verificar]
  F-INDIVIDUAL-RUTA:
    descripcion: Inicio Individual → compuerta ¿Masivo? (No) → flujo regular hasta Completar Información.
    variaciones: [cualquier combinación válida Línea/Ramo/Movimiento]
    capacidades: [iniciar_sesion, nuevo_caso, diligenciar, pulsar, verificar_ruta, abrir_caso, verificar]
  F-INDIVIDUAL-CONSULTA:
    descripcion: Inicio Individual por criterio → SISE → alertas → Completar Información (precarga, solo lectura, correo, documentos) → Confirmar → Análisis.
    variaciones: [criterio (Placa | Número de póliza | Tipo/Número de documento del Tomador), Línea (Autos muestra vehículo; Generales no), bloque Póliza RCE, edición de datos del Tomador en Póliza Nueva]
    capacidades: [iniciar_sesion, nuevo_caso, diligenciar, pulsar, verificar_ruta, abrir_caso, verificar, integracion]
  F-EXCEPCIONES:
    descripcion: Completar Información con mensajes de excepción y bucles (alerta bloqueante, carta de nombramiento, reconsulta).
    variaciones: [alerta bloqueante → solo Desistir, clave distinta → Carta de nombramiento, SISE sin datos → Nueva Consulta, RCE sin datos → reconsulta RCE]
    capacidades: [verificar (texto_exacto, botones_exactos, no_visible), diligenciar, pulsar, verificar_ruta]


    actor: analista
    propiedades:
      # FICTICIOS (2026-10-16, aclaración de Daniel): la edición de filas no consulta servicios externos. Distintos de la narrativa.
      - { nombre: poliza, fuente: generado, valor: "300654321" }
      - { nombre: poliza_nueva_fila, fuente: generado, valor: "300789012" }
    usado_por: [HU06-CP04]
    limpieza: Las filas se crean/eliminan DENTRO del caso creado por la prueba; nunca sobre casos ajenos.

  INI-CUMPL-MASIVO-SIN-RCE:
    descripcion: HU06-CP03. Cumplimiento (Fianzas), Ramo SIN propiedad Póliza RCE, Movimiento Modificación.

# HU06-CP02 — Radicación Masiva Autos y estructuración por Placa  (Fase 2, familia F-MASIVO-ESTRUCTURAR)
# Fuente: fuentes/20260928_SDE_CEL_V1_Casos de Prueba_HU06.xlsx, hoja CP02 (22 pasos).
# Actores según el manifest: radica el INTERMEDIARIO y estructura el ANALISTA. ENV-03 resuelto para INT-013403 (verificado
# el 2026-10-15 con @habilitacion): el intermediario sí inicia el proceso.
# Calibración:
#  - formulario de inicio, ruta Masiva, Estructurar información, columnas de la grilla y pestañas: VERIFICADO en QA;
#  - pop-up de la fila: abre (caso 426, Generales). Etiquetas propias de Autos ("Placa") [PENDIENTE];
#  - pruebas negativas de Placa: la capability está probada en DOM sintético; el mecanismo real (truncado por
#    maxlength o mensaje) [PENDIENTE]. ATENCIÓN BUG-03: si un paso falla con el pop-up abierto, el caso propio queda
#    inutilizable (salir del pop-up sin Guardar). Es un riesgo aceptado sobre casos de la automatización.
# "Documentos requeridos" (P7): Masiva/Modificación no exige documentos en QA (caso 343/426); la lista Tipo Documental de
# las Masivas está vacía (BUG-01). No se adjunta nada.
# UI-10 (2026-10-13): en el pop-up real las etiquetas NO siempre coinciden con las columnas de la grilla (caso 430). Calibrado:
# "Forma Consulta" (solo visualización) y "Número Póliza" (input, maxlength 20) en Masiva Modificación (caso 426). SIN calibrar:
# "Placa", "¿Requiere modificar RCE?", "Ramo RCE", "Número Póliza RCE". No ejecutar los pasos del pop-up hasta calibrarlos con QA
# (una etiqueta errónea con el pop-up abierto deja el caso inutilizable, BUG-03). Datos: la Matriz Data pide formato válido,
# "Datos de Cliente: N/A".
id: HU06-CP02
titulo: Masivo Autos — Worker AI, Estructurar información y reglas de Placa en Detalle Polizas Asociadas
etiquetas: [hu06, fase2, masivo, autos, cp02]
actores: [intermediario, analista]
datasets: [CFG-PROCESO, INI-AUTOS-MASIVO, EST-FILA-AUTOS-PLACA]
cleanup:
  politica: CLEANUP_NOT_APPLICABLE
  razon: El caso queda en Estructurar información con las filas editadas/agregadas por la prueba (identificable por ${unico}).
pasos:
  - incluir: sesion-y-formulario
    con: { actor: intermediario, p_sesion: [2], p_formulario: [2, 3] }

  - matriz: [3]
    hacer: diligenciar
    campos:
      - { campo: Línea, valor: "${dato:INI-AUTOS-MASIVO.linea}", tipo: lista }
      - { campo: Ramo, valor: "${dato:INI-AUTOS-MASIVO.ramo}", tipo: lista }
    verificar:
      # En Autos el Tipo de Solicitud se asigna solo (verificado en QA para Autos).
      - valor: { campo: Tipo de Solicitud, igual: "${dato:INI-AUTOS-MASIVO.movimiento}" }

  - matriz: [4]
    hacer: diligenciar
    campos:
      - { campo: Sucursal, valor: "${dato:INI-AUTOS-MASIVO.sucursal}", tipo: lista }

  - matriz: [5]
    hacer: diligenciar
    campos:
      - { campo: Tipo de Radicación, valor: "${dato:INI-AUTOS-MASIVO.tipo_radicacion}", tipo: radio }
    verificar:
      - visible: Descripción de la Solicitud (Masiva/Múltiple)
      - visible: Documentos Anexos

  - matriz: [6]
    hacer: verificar
    verificar:
      - texto_exacto: "Masivo: Solicitud asociada a más de una póliza."

  - matriz: [7]
    hacer: diligenciar
    campos:
      # Obligatorio en Masiva Autos aunque no esté en la matriz (OBS-08).
      - { campo: ¿Su solicitud requiere cambio de intermediario?, valor: "No", tipo: radio }
      - { campo: Descripción de la Solicitud (Masiva/Múltiple), valor: "${dato:INI-AUTOS-MASIVO.narrativa} ${dato:INI-AUTOS-MASIVO.narrativa_polizas}", tipo: area }

  - incluir: masivo-hasta-estructurar
    # p_worker [9]: recorrido gráfico hacia la tarea AI worker (2026-10-19); P12 (filas estructuradas visibles) lo juzga tabla_verificar.
    con: { p_crear: [8], p_compuerta: [9], p_worker: [9], p_estructurar: [10] }

  - matriz: [11]
    hacer: verificar
    verificar:
      - solo_lectura: [Número de Caso, Creador del Caso, Fecha de Creación, Línea, Ramo, Tipo de Solicitud, Tipo Radicación, Sucursal, Descripción Solicitud Masiva]
      - valor: { campo: Tipo Radicación, igual: "${dato:INI-AUTOS-MASIVO.tipo_radicacion}" }
      - visible: Información a Consultar

  # Estructura de la grilla: siempre. Filas del Worker AI con narrativa FICTICIA controlada (V1.1 y aclaración de Daniel, 2026-10-16:
  # la extracción no exige pólizas reales). "comparar" registra valores introducidos frente a observados; no se exige un número
  # exacto de filas porque el contrato de extracción (granularidad) no está confirmado. Antes: narrativa sin identificadores (casos 637–639).
  - matriz: [12]
    hacer: tabla_verificar
    tabla: Detalle Polizas Asociadas
    columnas: [Forma Consulta, Placa, Número Póliza]

  - matriz: [12]
    hacer: tabla_verificar
    tabla: Detalle Polizas Asociadas
    minimo_filas: 1
    comparar:
      Número Póliza: ["100245678", "1109876543", "9023456781"]
      Placa: ["ABC123", "XYZ987", "KLM456"]

  # Pop-up de la fila (P13–P21), calibrado el 2026-10-16 en el caso propio 651 (UI-10): abrir fila → cambiar → «Guardar» cierra y
  # la fila persiste al reabrir el caso. V1.1: el analista ELIGE la Forma de Consulta (Número de póliza o Placa) y solo se muestra
  # el campo elegido. Placas FICTICIAS (EST-FILA-AUTOS-PLACA, fuente generado): la edición no exige placas reales de QA.
  - matriz: [13]
    hacer: tabla_abrir_fila
    formulario: detalle-polizas-autos
    tabla: Detalle Polizas Asociadas
    fila: 1

  - matriz: [14]
    hacer: verificar
    verificar:
      - visible: Forma Consulta
      - no_visible: Número de Documento Tomador

  - matriz: [15]
    hacer: diligenciar
    campos:
      - { campo: Forma Consulta, valor: Placa, tipo: lista }
    verificar:
      - visible: Placa
      - no_visible: Número Póliza

  - matriz: [16]
    hacer: intentar_diligenciar
    campo: Placa
    valor: ""
    esperado_mostrado: ""

  - matriz: [16]
    hacer: dialogo_confirmar
    espera: permanece_abierto

  - matriz: [17]
    hacer: intentar_diligenciar
    campo: Placa
    valor: "${dato:EST-FILA-AUTOS-PLACA.placa}"
    esperado_mostrado: "${dato:EST-FILA-AUTOS-PLACA.placa}"

  - matriz: [17, 19]
    hacer: dialogo_confirmar
    espera: cierra
    fila_resultante:
      Placa: "${dato:EST-FILA-AUTOS-PLACA.placa}"

  - matriz: [20]
    hacer: tabla_agregar
    formulario: detalle-polizas-autos
    tabla: Detalle Polizas Asociadas
    verificar:
      - visible: Forma Consulta

  - matriz: [21]
    hacer: diligenciar
    campos:
      - { campo: Forma Consulta, valor: Placa, tipo: lista }
      - { campo: Placa, valor: "${dato:EST-FILA-AUTOS-PLACA.placa_nueva_fila}", tipo: texto }

  - matriz: [21]
    hacer: dialogo_confirmar
    espera: cierra
    fila_resultante:
      Placa: "${dato:EST-FILA-AUTOS-PLACA.placa_nueva_fila}"

  - incluir: estructurar-secciones
    con: { p_pestanas: [22], p_observaciones: [22] }

  # Si tras restaurar un valor válido «Guardar» no cierra (P-21a, casos 653 y 669), el pop-up queda abierto al terminar: por eso va al final.
  # P18 AL FINAL, tras reabrir la actividad (las pestañas de P22 ocultan la grilla; caso 654): «impide REGISTRAR un valor
  # de más de 6 caracteres». QA mostró dos comportamientos (P-21e): el pop-up queda abierto (caso 653) o se cierra sin guardar
  # el valor (caso 668, la fila conservó DEF456). Se exige que el valor NO quede registrado; si queda abierto, se restaura el
  # valor válido en el mismo paso.
  - matriz: [18]
    hacer: abrir_caso
    actor: analista
    actividad: Estructurar información
    maximo_minutos: 3

  - matriz: [18]
    hacer: tabla_abrir_fila
    formulario: detalle-polizas-autos
    tabla: Detalle Polizas Asociadas
    fila: 1

  - matriz: [18]
    hacer: diligenciar
    campos:
      - { campo: Placa, valor: "${dato:EST-FILA-AUTOS-PLACA.placa_larga}", tipo: texto }

  - matriz: [18]
    hacer: dialogo_confirmar
    espera: no_registra
    campo: Placa
    valor_rechazado: "${dato:EST-FILA-AUTOS-PLACA.placa_larga}"
    restaurar: "${dato:EST-FILA-AUTOS-PLACA.placa}"

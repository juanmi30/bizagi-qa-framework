# HU03-CP04 — Póliza Nueva Generales con Tomador EXISTENTE  (Fase 2, familia F-INDIVIDUAL-CONSULTA)
# Fuente: fuentes/20261006_SDE_CEL_V2_Casos de Prueba_HU03.xlsx, hoja CP04 (20 pasos).
# Actor: intermediario (ENV-03 vigente → BLOCKED de ambiente). Opción real del movimiento: "Póliza Nueva" (la matriz dice
# "Nueva Poliza"). P5 espera "campo Número de póliza" en Póliza Nueva por Tomador (FUNC-09): se verifican los campos del
# Tomador. Etiquetas del formulario de inicio CALIBRADAS con el intermediario (2026-10-13): "Tipo de Documento del Tomador" y
# "Número de Documento del Tomador". La regla "¿Requiere editar datos del tomador?" (Completar información) sigue [PENDIENTE].
# Documentos: el formulario de inicio Individual no tiene grilla de documentos (calibrado 2026-10-13).
id: HU03-CP04
titulo: Póliza Nueva Generales con Tomador existente — precarga del Tomador, edición autorizada, documentos y Análisis
etiquetas: [hu03, fase2, individual, generales, poliza-nueva, cp04]
actores: [intermediario]
datasets: [CFG-PROCESO, TOMADOR-EXISTENTE]
cleanup:
  politica: CLEANUP_NOT_APPLICABLE
  razon: El caso avanza a Análisis (estado de negocio esperado); no hay acción reversible para deshacerlo.
pasos:
  - incluir: sesion-y-formulario
    con: { actor: intermediario, p_sesion: [2], p_formulario: [3] }

  - matriz: [4]
    hacer: diligenciar
    campos:
      - { campo: Línea, valor: "${dato:TOMADOR-EXISTENTE.linea}", tipo: lista }
      - { campo: Ramo, valor: "${dato:TOMADOR-EXISTENTE.ramo}", tipo: lista }
      - { campo: Tipo de Solicitud, valor: "${dato:TOMADOR-EXISTENTE.movimiento}", tipo: lista }
      - { campo: Sucursal, valor: "${dato:TOMADOR-EXISTENTE.sucursal}", tipo: lista }

  - matriz: [5, 6]
    hacer: diligenciar
    campos:
      - { campo: Tipo de Radicación, valor: "${dato:TOMADOR-EXISTENTE.tipo_radicacion}", tipo: radio }
    verificar:
      - campo_visible: Tipo de Documento del Tomador
      - campo_visible: Número de Documento del Tomador
      - obligatorio: [Tipo de Documento del Tomador, Número de Documento del Tomador]

  - matriz: [6]
    hacer: no_automatizado
    razon: Tipo de dato/longitud y ortografía global sin especificación ni glosario (FUNC-09 sobre el campo esperado en P5).

  - matriz: [7]
    hacer: diligenciar
    campos:
      - { campo: Tipo de Documento del Tomador, valor: "${dato:TOMADOR-EXISTENTE.tipo_documento}", tipo: lista }
      - { campo: Número de Documento del Tomador, valor: "${dato:TOMADOR-EXISTENTE.numero_documento}", tipo: texto }

  # Calibrado con el intermediario (2026-10-13): el formulario de inicio Individual de Póliza Nueva NO tiene la grilla
  # "Documentos Anexos" (solo existe en Masiva). Los documentos de Póliza Nueva se validan en Completar información (P15/P16).
  - matriz: [7]
    hacer: verificar
    verificar:
      - no_visible: Documentos Anexos

  - incluir: individual-hasta-completar
    con:
      actor: intermediario
      linea: "${dato:TOMADOR-EXISTENTE.linea}"
      criterio: el número de identificación del Tomador
      respuesta_sise: retorna los datos del Tomador

  - matriz: [14]
    hacer: verificar
    verificar:
      - visible: Tomador
      - visible: ¿Requiere editar datos del tomador?

  - matriz: [14]
    hacer: no_automatizado
    razon: La matriz no enumera qué datos del Tomador son "autorizados" para edición; sin esa lista no hay aserción objetiva.

  - matriz: [15, 17]
    hacer: no_automatizado
    razon: Tipos documentales obligatorios de Póliza Nueva sin especificar (DOCS-OBLIGATORIOS) y nomenclatura sin glosario.

  - matriz: [16]
    hacer: verificar
    verificar:
      - editable: [Comentarios]

  - incluir: cierre-completar
    con: { actor: intermediario, p_botones: [18], p_confirmar: [19], p_accion: [19, 20] }

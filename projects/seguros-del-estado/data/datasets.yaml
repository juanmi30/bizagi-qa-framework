# Registro LÓGICO de datos de prueba SDE-CEL.
# Aquí NO hay valores reales: cada propiedad dice de dónde sale su valor.
#   fuente: matriz   -> literal tomado de la matriz QA (Excel); va en "valor".
#   fuente: qa       -> lo provee QA; el valor vive SOLO en projects/seguros-del-estado/.env (ignorado) bajo "env".
#   fuente: generado -> lo produce la prueba (ej. narrativa con ${unico}); va en "valor".
#   fuente: config   -> configuración del ambiente (no es dato de negocio); valor en .env bajo "env".
# El estado READY/MISSING se CALCULA en ejecución (sde/datos.ts): READY solo si todas las propiedades
# obligatorias tienen valor. Nunca se escriben valores de .env en reportes: se enmascaran.
# sensible: true -> dato de negocio de SISE (póliza, placa, documento): se enmascara en evidencias.

actores:
  intermediario:
    rol: Intermediario (radica y completa información)
    variables: [USUARIO_intermediario, CLAVE_intermediario]
    dominio: DOMINIO_intermediario   # opcional; si falta usa BIZAGI_LOGIN_DOMINIO
    usado_por: [HU06-CP01, HU06-CP02, HU06-CP03, HU06-CP04, HU06-CP05, HU03-CP01, HU03-CP02, HU03-CP03, HU03-CP04, HU03-CP05, HU03-CP06, HU03-CP07, HU03-CP08, HU03-CP10, HU03-CP11, HU03-CP12]
  analista:
    rol: Analista Centro de Expedición (Estructurar Información; Requirement 230849)
    variables: [USUARIO_analista, CLAVE_analista]
    dominio: DOMINIO_analista
    usado_por: [HU06-CP01, HU06-CP02, HU06-CP03, HU06-CP04]
  intermediario_alerta:
    rol: Intermediario cuya clave retorna alerta bloqueante (EN PROCESO DE CANCELACIÓN | SIN IDONEIDAD | SIN SARLAFT | SIN CONTRATO)
    variables: [USUARIO_intermediario_alerta, CLAVE_intermediario_alerta]
    dominio: DOMINIO_intermediario_alerta
    usado_por: [HU03-CP09]

datasets:
  CFG-PROCESO:
    descripcion: Cómo se inicia una Radicación en el Work Portal (nombre visible del proceso y categoría si existe).
    actor: intermediario
    propiedades:
      - { nombre: proceso, fuente: config, env: SDE_PROCESO_RADICACION }
      - { nombre: categoria, fuente: config, env: SDE_PROCESO_CATEGORIA, opcional: true }
    usado_por: [todos]
    limpieza: No aplica (configuración).

  DOC-SOPORTE:
    descripcion: Documento PDF sintético SIN PII para adjuntar donde la matriz pide "documentos obligatorios parametrizados".
    actor: intermediario
    propiedades:
      - { nombre: archivo, fuente: generado, valor: docs/soporte-prueba.pdf }
    nota: El ARCHIVO está listo; QUÉ tipos documentales son obligatorios por Línea/Ramo/Movimiento lo define DOCS-OBLIGATORIOS.
    limpieza: No aplica.

  DOCS-OBLIGATORIOS:
    descripcion: Tipos documentales parametrizados como obligatorios en el formulario de inicio (por Línea/Ramo/Movimiento y modalidad).
    actor: intermediario
    propiedades:
      # Opcionales: el paso de adjunto verifica PRIMERO que la lista ofrezca tipos (defecto si está vacía) y solo
      # después necesita el nombre del tipo obligatorio; si falta, ese paso queda BLOCKED.
      - { nombre: tipos_generales_masivo, fuente: qa, env: SDE_DOCS_GENERALES_MASIVO, opcional: true }
      - { nombre: tipos_individual, fuente: qa, env: SDE_DOCS_INDIVIDUAL, opcional: true }
    usado_por: [HU06-CP01, HU06-CP02, HU06-CP03, HU06-CP04, HU06-CP05, HU03-CP01, HU03-CP02, HU03-CP03, HU03-CP04, HU03-CP05, HU03-CP06, HU03-CP07, HU03-CP08]
    limpieza: No aplica.

  INI-INDIVIDUAL-RUTA:
    descripcion: >-
      HU06-CP05. Combinación válida Línea/Ramo/Movimiento/Sucursal + criterio de consulta individual.
      La aserción del CP es la RUTA de la compuerta (no el resultado SISE), pero el criterio debe ser provisto por QA:
      no se inventan pólizas/placas/documentos.
    actor: intermediario
    propiedades:
      - { nombre: linea, fuente: qa, env: SDE_RUTA_LINEA }
      - { nombre: ramo, fuente: qa, env: SDE_RUTA_RAMO }
      - { nombre: movimiento, fuente: qa, env: SDE_RUTA_MOVIMIENTO }
      - { nombre: sucursal, fuente: qa, env: SDE_SUCURSAL }
      - { nombre: tipo_radicacion, fuente: matriz, valor: Individual }
      - { nombre: forma_consulta, fuente: qa, env: SDE_RUTA_FORMA_CONSULTA }
      - { nombre: criterio_campo, fuente: qa, env: SDE_RUTA_CRITERIO_CAMPO }
      - { nombre: criterio_valor, fuente: qa, env: SDE_RUTA_CRITERIO_VALOR, sensible: true }
    usado_por: [HU06-CP05]
    limpieza: CLEANUP_NOT_APPLICABLE — la radicación queda como evidencia en QA (no se desiste para no alterar el flujo).

  INI-GENERALES-MASIVO:
    descripcion: HU06-CP01. Radicación Masiva Línea Generales, Movimiento Póliza Nueva (paso 19 de la matriz).
    actor: intermediario
    propiedades:
      - { nombre: linea, fuente: matriz, valor: Generales }
      - { nombre: ramo, fuente: qa, env: SDE_GEN_RAMO }
      - { nombre: movimiento, fuente: matriz, valor: Póliza Nueva }
      - { nombre: sucursal, fuente: qa, env: SDE_SUCURSAL }
      # La matriz dice "Masivo"; la opción REAL del radio en QA es "Masiva" (hallazgo de nomenclatura OBS-02).
      - { nombre: tipo_radicacion, fuente: matriz, valor: Masiva }
      - { nombre: narrativa, fuente: generado, valor: "Ref. QA ${unico}." }
      # Narrativa FICTICIA y controlada (HU06 V1.1 + aclaración de Daniel, 2026-10-16): la extracción del Worker AI no exige
      # pólizas existentes en SISE. Máx. 500 caracteres en total con la referencia de la corrida (regresión unitaria).
      - { nombre: narrativa_polizas, fuente: generado, valor: "Se solicita la expedición de pólizas nuevas para los tomadores identificados con NIT 900123456, 800765432 y 901234567. Cada póliza debe emitirse con las condiciones definidas para la solicitud y la información de cada tomador debe validarse antes de la expedición." }
    nota: >-
      La narrativa (narrativa_polizas) es FICTICIA y controlada: la extracción del Worker AI no exige tomadores existentes
      (V1.1 y aclaración de Daniel, 2026-10-16). P17 compara los NIT introducidos con los observados en la grilla.
    usado_por: [HU06-CP01]
    limpieza: CLEANUP_NOT_APPLICABLE — evidencia de radicación masiva.

  EST-FILA-GENERALES-PN:
    descripcion: HU06-CP01 pasos 21–25. Datos para editar/agregar fila en Pólizas asociadas (Forma de Consulta Identificación de Tomador).
    actor: analista
    propiedades:
      - { nombre: tipo_documento, fuente: matriz, valor: NIT }
      # FICTICIOS (2026-10-16, aclaración de Daniel): la edición de filas no consulta servicios externos. Distintos de la narrativa.
      - { nombre: numero_documento, fuente: generado, valor: "900456789" }
      - { nombre: numero_documento_nueva_fila, fuente: generado, valor: "900987654" }
    usado_por: [HU06-CP01]
    limpieza: Las filas se crean/eliminan DENTRO del caso creado por la prueba; nunca sobre casos ajenos.

  EST-FILA-AUTOS-PLACA:
    descripcion: HU06-CP02 pasos 13–21. Placas ficticias para editar/agregar filas de Detalle Polizas Asociadas (consulta por Placa).
    actor: analista
    propiedades:
      # Placas FICTICIAS (2026-10-16, aclaración de Daniel): la edición de filas no consulta servicios externos. Distintas de las de la
      # narrativa (ABC123, XYZ987, KLM456) para identificar la fila editada o agregada por su valor exacto. V1.1: alfanumérica, máx. 6.
      - { nombre: placa, fuente: generado, valor: DEF456 }
      - { nombre: placa_nueva_fila, fuente: generado, valor: GHJ789 }
      - { nombre: placa_larga, fuente: generado, valor: MNP4567 }
    usado_por: [HU06-CP02]
    limpieza: Las filas se crean/editan DENTRO del caso creado por la prueba; nunca sobre casos ajenos.

  INI-AUTOS-MASIVO:
    descripcion: HU06-CP02. Masivo Autos; edición por Placa (máx. 6 caracteres).
    actor: intermediario
    propiedades:
      - { nombre: linea, fuente: matriz, valor: Autos }
      - { nombre: ramo, fuente: qa, env: SDE_AUTOS_RAMO }
      # Mismo Ramo Autos de QA que HU03/HU06-CP05: su Tipo de Solicitud se asigna automáticamente (verificado en el inicio,
      # HU06-CP05 P3, 2026-10-15). Confirmar con Iván si Masivo Autos debe usar otro Ramo o movimiento (P-12).
      - { nombre: movimiento, fuente: qa, env: SDE_AUTOS_MOVIMIENTO }
      - { nombre: sucursal, fuente: qa, env: SDE_SUCURSAL }
      - { nombre: tipo_radicacion, fuente: matriz, valor: Masiva }
      - { nombre: narrativa, fuente: generado, valor: "Ref. QA ${unico}." }
      # Narrativa FICTICIA y controlada (HU06 V1.1 + aclaración de Daniel, 2026-10-16): la extracción del Worker AI no exige
      # pólizas existentes en SISE. Máx. 500 caracteres en total con la referencia de la corrida (regresión unitaria).
      - { nombre: narrativa_polizas, fuente: generado, valor: "Se solicita realizar la modificación de las pólizas de automóviles 100245678 y 1109876543, asociadas a los vehículos de placas ABC123 y XYZ987, y de la póliza 9023456781 del vehículo de placa KLM456. El cambio corresponde a la actualización de la información registrada, manteniendo sin cambios los datos que no hagan parte del ajuste solicitado." }
    nota: >-
      Las placas de las filas están en EST-FILA-AUTOS-PLACA (placa_nueva_fila DISTINTA de placa). La narrativa con
      placas/pólizas reales (narrativa_polizas) es la que permite al Worker AI estructurar filas editables.
    usado_por: [HU06-CP02]
    limpieza: CLEANUP_NOT_APPLICABLE.

  EST-FILA-CUMPL-SIN-RCE:
    descripcion: HU06-CP03 pasos 12–23. Póliza de Cumplimiento y datos RCE de QA para editar la fila de Detalle Polizas Asociadas.
    actor: analista
    propiedades:
      # FICTICIOS (2026-10-16, aclaración de Daniel): la edición de filas no consulta servicios externos. Distintos de la narrativa.
      - { nombre: poliza, fuente: generado, valor: "300123456" }
      # Ramo RCE: opción de una lista paramétrica de QA (no se inventa).
      - { nombre: ramo_rce, fuente: qa, env: SDE_CUMPL_RAMO_RCE }
      - { nombre: poliza_rce, fuente: generado, valor: "400123456" }
    usado_por: [HU06-CP03]
    limpieza: Las filas se editan DENTRO del caso creado por la prueba; nunca sobre casos ajenos.

  EST-FILA-CUMPL-CON-RCE:

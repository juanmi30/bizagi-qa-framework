      - { nombre: movimiento, fuente: qa, env: SDE_AUTOS_MOVIMIENTO }
      - { nombre: sucursal, fuente: qa, env: SDE_SUCURSAL }
      - { nombre: tipo_radicacion, fuente: matriz, valor: Individual }
      - { nombre: forma_consulta, fuente: matriz, valor: Número de póliza }
      - { nombre: poliza, fuente: qa, env: SDE_AUTOS_POLIZA, sensible: true }
      # Clave intermediario de la cuenta USUARIO_intermediario (cuenta habilitada con rol CE_Intermediarios, 2026-10-13).
      # No se usa en la UI: documenta que la póliza debe pertenecer a ESTA clave (si no, el caso deriva a carta de nombramiento).
      - { nombre: clave_intermediario, fuente: qa, env: SDE_INTERMEDIARIO_CLAVE, sensible: true, opcional: true }
    relaciones: póliza ↔ clave del intermediario (misma clave) ↔ vehículo/placa ↔ tomador/asegurado
    usado_por: [HU03-CP02]
